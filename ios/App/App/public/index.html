<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SuppStack</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171717;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main {
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        color: #a3a3a3;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        background: #fafafa;
        color: #171717;
        border: 0;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!--
      Offline fallback only. The native shell normally loads the production
      web app via server.url in capacitor.config.ts; this page renders when
      the remote app cannot be reached.
    -->
    <main>
      <h1>SUPPSTACK</h1>
      <p>We couldn&rsquo;t reach SuppStack.<br />Check your connection and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
