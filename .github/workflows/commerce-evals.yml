name: Commerce evaluations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commerce-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://commerce-eval.supabase.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eval-public-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval:commerce
      - run: node --test src/scripts/iosPackageClassList.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run eval:ui -- --output=test-results/chromium
      # Linux headless WebKit can stall its frame-based click checks (playwright#33057).
      - run: xvfb-run --auto-servernum npm run eval:ui -- evals/directory.spec.ts --browser=webkit --headed --output=test-results/webkit
        timeout-minutes: 3
        env:
          COMMERCE_EVAL_REPORT: test-results/webkit-report.json
      - run: npx tsc --noEmit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: commerce-evidence
          path: test-results/
          retention-days: 7
